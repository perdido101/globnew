services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: globalwire
      POSTGRES_PASSWORD: globalwire
      POSTGRES_DB: globalwire
    ports:
      - "5433:5432"
    volumes:
      - gw_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalwire"]
      interval: 2s
      timeout: 3s
      retries: 30
  # Full stack in containers: `docker compose --profile full up --build` → http://localhost:8787
  app:
    profiles: [full]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://globalwire:globalwire@db:5432/globalwire
      IMAGE_PROXY_SECRET: ${IMAGE_PROXY_SECRET:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "8787:8787"
volumes:
  gw_pg:
