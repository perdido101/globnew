name: Deploy demo to GitHub Pages

# Static demo: the web app in DEMO mode replaying apps/web/public/demo/snapshot.json in the browser.
# Refresh the recording with `node scripts/make-demo-snapshot.mjs` against a running server.
on:
  push:
    branches: [claude/new-session-w9c2xr, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build demo
        run: pnpm --filter @gw/web exec vite build --outDir ../../dist-pages --emptyOutDir
        env:
          VITE_DEMO: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp dist-pages/index.html dist-pages/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
